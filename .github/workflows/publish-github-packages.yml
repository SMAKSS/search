name: Publish @smakss/search to GitHub Packages

on:
  workflow_run:
    workflows: ['Release @smakss/search']
    types: [completed]
    branches: [master]

concurrency:
  group: github-packages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find semantic-release tag
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(git describe --tags --exact-match "$RELEASE_SHA" 2>/dev/null || true)"
          case "$tag" in
            v[0-9]*)
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Configure GitHub Packages registry
        if: steps.release.outputs.version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com/
          scope: "@smakss"

      - name: Setup pnpm and dependencies
        if: steps.release.outputs.version != ''
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: false
          cache: true
          require-lockfile: true

      - name: Set package version from release tag
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            packageJson.version = process.env.RELEASE_VERSION;
            fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          '

      - name: Build package
        if: steps.release.outputs.version != ''
        run: pnpm run generate

      - name: Check if version is already published
        id: registry
        if: steps.release.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: "@smakss/search"
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version --registry=https://npm.pkg.github.com/ >"$RUNNER_TEMP/npm-view.log" 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-view.log"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: steps.release.outputs.version != '' && steps.registry.outputs.published != 'true'
        run: pnpm publish --no-git-checks --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
