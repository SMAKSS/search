name: PR Checks

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    - name: Print head and base refs
      run: |
        echo "Head ref: ${{ github.head_ref }}"
        echo "Base ref: ${{ github.base_ref }}"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "18"

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-node-18-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node-18-yarn-

    - name: Install dependencies
      run: yarn install

    - name: Run Tests
      run: yarn test

    - name: Type check
      run: yarn typecheck

    - name: Check code quality
      run: |
        yarn lint
        yarn format:check
        yarn run --if-present generate

    - name: Security Audit
      run: yarn audit --level moderate || true
      continue-on-error: true

    - name: Security Audit Summary
      if: success() || failure()
      run: yarn audit --summary

    - name: Archive production artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-artifacts
        path: ./build/

    - name: Error handling
      if: failure()
      run: echo "CI failed. Please check the logs."
